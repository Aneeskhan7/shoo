<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- These are the pre-hydration fallback (non-JS scrapers, and the
         instant briefly before React mounts). Every route overwrites them
         via useSeo() — see client/src/hooks/useSeo.js — this is not the
         source of truth for any indexable page's actual tags. -->
    <title>SHOO — Premium Sneakers & Streetwear in Pakistan</title>
    <meta name="description" content="Curated for every step. Premium sneakers and streetwear, 100% authentic, nationwide delivery with cash on delivery." />
    <link rel="canonical" href="https://www.shoo.business/" />
    <meta property="og:title" content="SHOO — Premium Sneakers & Streetwear in Pakistan" />
    <meta property="og:description" content="Curated for every step. Premium sneakers and streetwear, 100% authentic, nationwide delivery with cash on delivery." />
    <meta property="og:image" content="https://www.shoo.business/brand/cover.png" />
    <meta property="og:url" content="https://www.shoo.business/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SHOO" />
    <meta name="theme-color" content="#0A0A0A" />
    <!-- Every product photo is served from Cloudinary — opening the
         connection before the first <img> is discovered saves a DNS+TLS
         round trip on pages with several product images (Drop 01, shop grid). -->
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />
    <!-- Home page's LCP element (measured live: LCP 5.19s vs. FCP 1.22s).
         Without this the browser only discovers this <img> once React has
         mounted the Hero component — preloading starts the fetch the
         moment the HTML parses, in parallel with the JS bundle. -->
    <link rel="preload" as="image" href="/assets/hero/shoo-drift-one.webp" fetchpriority="high" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
