services:
  postgres:
    image: postgres:16-alpine
    container_name: shoo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shoo
      POSTGRES_PASSWORD: shoo
      POSTGRES_DB: shoo
    ports:
      - "5432:5432"
    volumes:
      - shoo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shoo -d shoo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  shoo-pgdata:
